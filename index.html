<div class="card rise"><div class="card-h"><h2 class="h3">Details used in drafts</h2></div><div class="form-grid">
<div class="field wide"><label for="p-portfolio">Portfolio</label><input class="input" id="p-portfolio" type="url" value="${esc(p.portfolioUrl || "")}" placeholder="https://"></div>
<div class="field"><label for="p-linkedin">LinkedIn</label><input class="input" id="p-linkedin" value="${esc(p.linkedinUrl || "")}"></div>
<div class="field"><label for="p-email">Email</label><input class="input" id="p-email" type="email" value="${esc(p.email || "")}"></div>
<div class="field wide"><label for="p-pitch">One-line intro</label><textarea class="textarea" id="p-pitch" style="min-height:76px">${esc(p.pitch || "")}</textarea></div>
<div class="field wide"><label for="p-sign">Sign-off name</label><input class="input" id="p-sign" value="${esc(p.signature || "")}"></div>
</div><div class="acts" style="margin-top:16px"><button class="btn btn-white" type="button" data-act="save-profile">Save</button></div></div>
<div style="display:flex;flex-direction:column;gap:16px;min-width:0">
<div class="card rise"><div class="card-h"><h2 class="h3">Automation</h2><span class="tag tag-green">Running</span></div><dl class="kv">
<dt>Scan</dt><dd>LinkedIn and Gmail every 2 hours, 8 AM to 10 PM</dd>
<dt>Outreach</dt><dd>Approved roles get about 5 people and drafts, every hour</dd>
<dt>Last scan</dt><dd>${a.lastRadarAt ? `${esc(fmtDate(a.lastRadarAt))}, ${esc(fmtTime(a.lastRadarAt))}` : "Not yet"}${a.lastRadarNote ? ` · ${esc(a.lastRadarNote)}` : ""}</dd>
<dt>Sources</dt><dd>LinkedIn ${a.connections?.linkedin ? "✓" : "—"} · Gmail ${a.connections?.gmail ? "✓" : "—"} · Outlook ${a.connections?.outlook ? "✓" : "not linked"}</dd>
<dt>Sending</dt><dd>Never automatic. Drafts wait for you.</dd>
</dl></div>
<div class="card rise"><div class="card-h"><h2 class="h3">Connection</h2></div><dl class="kv"><dt>Data</dt><dd class="mono-text" style="font-family:var(--mono);font-size:13px">${esc(S.cfg.repo)}</dd><dt>Token</dt><dd>Saved on this device only</dd><dt>Synced</dt><dd>${esc(rel(S.lastSync))}</dd></dl><div class="acts" style="margin-top:16px;justify-content:flex-start"><button class="btn btn-sm" type="button" data-act="refresh">Sync now</button><button class="btn btn-sm btn-ghost" type="button" data-act="disconnect">Disconnect this device</button></div></div>
</div>
</div>
<div class="card rise" style="margin-top:16px"><div class="card-h"><h2 class="h3">Activity</h2><span class="small">What the background jobs did</span></div>${log.length ? `<ul class="timeline">${log.map(e => `<li><span></span><time>${esc(fmtDate(e.at))}</time><span>${esc(e.text)}</span></li>`).join("")}</ul>` : `<p class="small" style="margin:0">Scans and outreach runs will show up here.</p>`}</div>
</section>`;
}
function viewLock(){
const tokenUrl = "https://github.com/settings/personal-access-tokens/new?name=Job%20Search%20HQ&description=Read%20and%20write%20job-search-hq-data&target_name=Indo1919&expires_in=366&contents=write";
return `<div class="lock"><div class="lock-in">
<p class="eyebrow rise">Job Search HQ</p>
<h1 class="display rise">Your search.<br><span class="grad">Running itself.</span></h1>
<p class="lede rise" style="margin-inline:auto">Private to you. Connect this device to your data once and it stays connected.</p>
<form class="card rise" id="lock-form">
<ol><li><a href="${tokenUrl}" target="_blank" rel="noopener">Create a fine-grained GitHub token ↗</a></li><li>Repository access: only <b style="color:var(--text)">job-search-hq-data</b>. Permissions: <b style="color:var(--text)">Contents → Read and write</b>.</li><li>Paste it below.</li></ol>
<div class="field" style="margin-bottom:12px"><label for="l-repo">Data repository</label><input class="input" id="l-repo" name="repo" value="${esc(S.cfg.repo || DEFAULT_REPO)}" autocomplete="off" spellcheck="false"></div>
<div class="field"><label for="l-token">Access token</label><input class="input" id="l-token" name="token" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></div>
${S.error ? `<div class="err" role="alert">${esc(S.error)}</div>` : ""}
<div class="acts" style="margin-top:18px;justify-content:space-between;align-items:center"><span class="hint">The token stays in this browser and only talks to GitHub.</span><button class="btn btn-white" type="submit">Connect</button></div>
</form>
</div></div>`;
}
function drawerJob(j){
const url = safeUrl(j.url), o = j.outreach || {}, tl = [...(j.timeline || [])].reverse();
const people = contactsOf(j).length ? `<div class="list" style="margin:0 -2px">${contactsOf(j).map((c,i) => contactHTML(j,c,i)).join("")}</div>`
: ["queued","working"].includes(o.state) ? `<div class="stateline" style="padding:4px 0"><span class="spin"></span>${o.state === "working" ? "Claude is researching the team now." : "Queued. Claude starts within the hour."}</div>`
: ["new","passed"].includes(j.status) ? `<p class="small" style="margin:0 0 14px">Approve this role and Claude finds about 5 people to message, with a draft for each.</p><button class="btn btn-approve" type="button" data-act="approve" data-id="${esc(j.id)}">Approve</button>`
: `<p class="small" style="margin:0 0 14px">No outreach for this role yet.</p><button class="btn btn-sm" type="button" data-act="rerun" data-id="${esc(j.id)}">Find people</button>`;
return `<div class="d-hero">${logo(j.company)}<div style="min-width:0"><div class="co">${esc(j.company)}</div><h2>${esc(j.role)}</h2><div class="meta">${esc([j.location, j.workplace, j.salary].filter(Boolean).join(" · "))}</div></div></div>
<div class="steps" role="group" aria-label="Status">${STATUS.map(s => `<button type="button" data-act="status" data-id="${esc(j.id)}" data-k="${s.k}" aria-pressed="${j.status === s.k}">${s.l}</button>`).join("")}</div>
${j.note ? `<div class="card" style="padding:18px"><p style="margin:0;font-size:15px;color:var(--text-2)">${esc(j.note)}</p></div>` : ""}
<div class="card" style="padding:18px"><h3 class="h3" style="font-size:16px;margin-bottom:14px">Tracking</h3><div class="form-grid">
<div class="field"><label for="d-app">Application number</label><input class="input" id="d-app" data-field="applicationNumber" data-id="${esc(j.id)}" value="${esc(j.applicationNumber || "")}" placeholder="Filled in from your email" style="font-family:var(--mono);font-size:14px"></div>
<div class="field"><label>Job number</label><div class="input" style="font-family:var(--mono);font-size:14px;color:var(--text-2)">${esc(j.reqId || j.linkedinJobId || "—")}</div></div>
<div class="field"><label for="d-next">Next step</label><input class="input" id="d-next" data-field="nextStep" data-id="${esc(j.id)}" value="${esc(j.nextStep || "")}" placeholder="e.g. Portfolio review"></div>
<div class="field"><label for="d-nextat">Date</label><input class="input" id="d-nextat" type="date" data-field="nextStepAt" data-kind="date" data-id="${esc(j.id)}" value="${esc(toDateInput(j.nextStepAt))}"></div>
<div class="field wide"><label for="d-notes">Notes</label><textarea class="textarea" id="d-notes" data-field="notes" data-id="${esc(j.id)}" placeholder="Anything worth remembering">${esc(j.notes || "")}</textarea></div>
</div><dl class="kv" style="margin-top:16px">${j.appliedAt ? `<dt>Applied</dt><dd>${esc(fmtDate(j.appliedAt))}</dd>` : ""}${j.postedAt ? `<dt>Posted</dt><dd>${esc(fmtDate(j.postedAt))}</dd>` : ""}<dt>Source</dt><dd>${esc(j.source || "LinkedIn")}</dd>${url ? `<dt>Posting</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">Open on LinkedIn ↗</a></dd>` : ""}</dl></div>
${j.lastEmail?.subject ? `<div class="card" style="padding:18px"><h3 class="h3" style="font-size:16px;margin-bottom:8px">Latest email</h3><div style="font-weight:600">${esc(j.lastEmail.subject)}</div><div class="small">${esc(j.lastEmail.from || "")} · ${esc(rel(j.lastEmail.at))}</div>${j.lastEmail.snippet ? `<p style="margin:10px 0 0;color:var(--text-2);font-size:14.5px">${esc(j.lastEmail.snippet)}</p>` : ""}${safeUrl(j.lastEmail.url) ? `<p style="margin:10px 0 0"><a href="${esc(safeUrl(j.lastEmail.url))}" target="_blank" rel="noopener">Open in Gmail ↗</a></p>` : ""}</div>` : ""}
<div class="card" style="padding:18px"><div class="card-h" style="margin-bottom:10px"><h3 class="h3" style="font-size:16px">People to message</h3>${contactsOf(j).length ? `<button class="btn btn-sm btn-ghost" type="button" data-act="tpl-job" data-id="${esc(j.id)}">Templates</button>` : ""}</div>${people}</div>
${tl.length ? `<div class="card" style="padding:18px"><h3 class="h3" style="font-size:16px;margin-bottom:10px">History</h3><ul class="timeline">${tl.map(e => `<li><span></span><time>${esc(fmtDate(e.at))}</time><span>${esc(e.text)}</span></li>`).join("")}</ul></div>` : ""}`;
}
function drawerNewJob(){
return `<div><p class="eyebrow">Add a role</p><h2 class="h2" style="font-size:32px">Track something <span class="dim">you found.</span></h2></div><form class="card" id="job-form" style="padding:18px"><div class="form-grid"><div class="field"><label for="j-company">Company</label><input class="input" id="j-company" name="company" required></div><div class="field"><label for="j-role">Role</label><input class="input" id="j-role" name="role" required></div><div class="field wide"><label for="j-url">Posting link</label><input class="input" id="j-url" name="url" type="url" placeholder="https://www.linkedin.com/jobs/view/…"></div><div class="field"><label for="j-loc">Location</label><input class="input" id="j-loc" name="location" placeholder="New York, NY"></div><div class="field" style="justify-content:flex-end"><label style="display:flex;gap:9px;align-items:center;color:var(--text);font-weight:500;font-size:14.5px"><input type="checkbox" name="applied"> I already applied</label></div></div><div class="acts" style="margin-top:16px"><button class="btn btn-white" type="submit">Add role</button></div></form>`;
}
function renderDrawer(){
const wrap = $("drawer");
if (!S.drawer) { wrap.hidden = true; return; }
const body = $("drawer-body");
const ae = document.activeElement;
if (body.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
if (S.drawer.type === "job") {
const j = S.data.jobs[S.drawer.id]; if (!j) { closeDrawer(); return; }
$("drawer-title").textContent = j.company;
const open = [...body.querySelectorAll("details")].map((d,i) => d.open ? i : -1).filter(i => i >= 0);
const scroll = body.scrollTop;
body.innerHTML = drawerJob(j);
if (S.drawer.last === j.id) { const ds = body.querySelectorAll("details"); open.forEach(i => ds[i] && (ds[i].open = true)); body.scrollTop = scroll; }
S.drawer.last = j.id;
} else if (S.drawer.type === "newjob") { $("drawer-title").textContent = "Add a role"; if (!$("job-form")) body.innerHTML = drawerNewJob(); }
wrap.hidden = false;
}
let lastFocus;
function openDrawer(d){ lastFocus = document.activeElement; S.drawer = d; renderDrawer(); $("drawer").querySelector(".drawer-bar .btn").focus({preventScroll:true}); }
function closeDrawer(){ S.drawer = null; $("drawer").hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); }
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
function render(){
$("nav").innerHTML = navHTML();
const root = $("app");
if (!S.connected) { if (!$("lock-form") || S.error) { root.innerHTML = viewLock(); root.classList.add("intro"); } return; }
const ae = document.activeElement, keep = ae && root.contains(ae) && ae.id ? ae.id : null;
const sel = keep && "selectionStart" in ae ? [ae.selectionStart, ae.selectionEnd] : null;
if (keep && (/^p-|^n-|^t-(subject|body)$/.test(keep))) { renderDrawer(); return; }
const v = {overview:viewOverview, discover:viewDiscover, pipeline:viewPipeline, outreach:viewOutreach, network:viewNetwork, templates:viewTemplates, setup:viewSetup}[S.tab];
const openDetails = root.dataset.view === S.tab ? [...root.querySelectorAll("details")].map((d,i) => d.open ? i : -1).filter(i => i >= 0) : [];
root.innerHTML = v();
root.dataset.view = S.tab;
if (openDetails.length) { const ds = root.querySelectorAll("details"); openDetails.forEach(i => ds[i] && (ds[i].open = true)); }
root.classList.toggle("intro", S.intro);
if (S.intro) { countUp(root); clearTimeout(render.t); render.t = setTimeout(() => { S.intro = false; root.classList.remove("intro"); root.querySelectorAll("[data-count]").forEach(el => el.textContent = el.dataset.count); }, 1600); }
if (keep) { const el = $(keep); if (el) { el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
renderDrawer();
}
function countUp(root){
const els = root.querySelectorAll("[data-count]"); if (!els.length) return;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach(el => el.textContent = el.dataset.count); return; }
const start = performance.now(), dur = 1100;
const step = t => { const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3); els.forEach(el => el.textContent = Math.round(Number(el.dataset.count) * e)); if (p < 1) requestAnimationFrame(step); };
requestAnimationFrame(step);
}
function go(tab){ if (!TABS.some(t => t.k === tab)) return; S.tab = tab; S.intro = true; try { history.replaceState(null, "", "#" + tab); } catch {} render(); window.scrollTo({top:0, behavior:"smooth"}); }
document.addEventListener("click", e => {
const t = e.target;
const tab = t.closest("[data-tab]"); if (tab) { go(tab.dataset.tab); return; }
const fl = t.closest("[data-filter]"); if (fl) { S.filter = fl.dataset.filter; render(); return; }
const tp = t.closest(".tpl-item[data-tpl]"); if (tp) { S.tpl.id = tp.dataset.tpl; S.tpl.editing = false; render(); return; }
const a = t.closest("[data-act]");
if (a) {
const id = a.dataset.id, i = Number(a.dataset.i);
switch (a.dataset.act) {
case "close": closeDrawer(); break;
case "approve": approve(id); break;
case "pass": pass(id); break;
case "restore": { const j = S.data.jobs[id]; save("jobs", d => { if (d[id]) { d[id].status = "new"; d[id].timeline = touch(d[id], "Restored"); } return d; }, `Restore ${j?.company}`, "Restored."); break; }
case "status": setStatus(id, a.dataset.k); break;
case "sent": toggleSent(id, i); break;
case "copy": { const c = contactsOf(S.data.jobs[id] || {})[i]; if (c) copyText(c.subject ? `Subject: ${c.subject}\n\n${c.message}` : c.message, a, "Copy"); break; }
case "followed": followedUp(id); break;
case "scheduled": setNet(id, "scheduled"); break;
case "netform": S.netForm = !S.netForm; render(); if (S.netForm) setTimeout(() => $("n-name")?.focus(), 0); break;
case "newjob": openDrawer({type:"newjob"}); setTimeout(() => $("j-company")?.focus(), 30); break;
case "rerun": { const j = S.data.jobs[id]; save("jobs", d => { if (d[id]) { d[id].outreach = {state:"queued", updatedAt:now(), note:"Requested from dashboard"}; d[id].timeline = touch(d[id], "Outreach requested"); } return d; }, `Queue outreach for ${j?.company}`, "Queued. Claude starts within the hour."); break; }
case "save-profile": saveProfile(); break;
case "refresh": loadAll(false).then(() => { render(); toast("Synced with GitHub."); }).catch(() => toast("Couldn't reach GitHub. Try again in a moment.")); break;
case "disconnect": saveCfg({repo:S.cfg.repo}); S.connected = false; S.data = structuredClone(DEFAULTS); render(); break;
case "tpl-copy": { const tt = currentTemplate(); copyText(fillTemplate(tt.body, tplVars(), false).replace(/\n{3,}/g,"\n\n").trim(), a, "Copy message"); break; }
case "tpl-copy-subj": { const tt = currentTemplate(); copyText(fillTemplate(tt.subject, tplVars(), false), a, "Copy subject"); break; }
case "tpl-edit": S.tpl.editing = !S.tpl.editing; render(); break;
case "tpl-save": saveTemplate(); break;
case "tpl-reset": resetTemplate(); break;
case "tpl-for": S.tpl.id = a.dataset.tpl; S.tpl.first = a.dataset.name || ""; go("templates"); break;
case "tpl-job": S.tpl.job = id; closeDrawer(); go("templates"); break;
}
return;
}
const o = t.closest("[data-open]");
if (o && !t.closest("a,button:not([data-open]),summary,details,input,select,textarea")) openDrawer({type:"job", id:o.dataset.open});
});
document.addEventListener("keydown", e => {
if (e.key === "Escape" && S.drawer) closeDrawer();
else if ((e.key === "Enter" || e.key === " ") && e.target.matches("article[data-open]")) { e.preventDefault(); openDrawer({type:"job", id:e.target.dataset.open}); }
});
document.addEventListener("input", e => {
const id = e.target.id;
if (id === "q") { S.q = e.target.value; schedule(); }
else if (id === "t-first") { S.tpl.first = e.target.value; schedule(); }
else if (id === "t-context") { S.tpl.context = e.target.value; schedule(); }
});
document.addEventListener("change", e => {
const el = e.target;
if (el.id === "t-job") { S.tpl.job = el.value; render(); return; }
if (el.id === "t-school") { S.tpl.school = el.value; render(); return; }
if (el.dataset?.field && el.dataset.id) setField(el.dataset.id, el.dataset.field, el.dataset.kind === "date" ? fromDateInput(el.value) : el.value.trim());
});
document.addEventListener("submit", async e => {
const f = e.target; e.preventDefault();
if (f.id === "lock-form") {
const repo = String(new FormData(f).get("repo")||"").trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, ""), token = String(new FormData(f).get("token")||"").trim();
if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { S.error = "Use the owner/name format, like Indo1919/job-search-hq-data."; render(); return; }
if (!token) { S.error = "Paste your access token."; render(); return; }
const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Connecting…";
try { await connect(repo, token); S.error = ""; S.intro = true; readyResolve(true); render(); startPolling(); toast("Connected. Welcome back."); }
catch (err) { saveCfg({repo}); S.error = err.message || "Couldn't connect."; render(); }
}
if (f.id === "job-form") addJob(f);
if (f.id === "net-form") addContact(f);
});
let pollT;
function startPolling(){
clearInterval(pollT);
pollT = setInterval(async () => {
if (document.hidden || !S.connected) return;
try { if (await loadAll(true)) schedule(); } catch (e) { if (e.status === 401) { S.connected = false; S.error = "Your token expired or was revoked. Connect again."; render(); } }
}, 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.connected) loadAll(true).then(c => c && schedule()).catch(() => {}); });
}
async function boot(){
if (S.cfg.token && S.cfg.repo) {
try { await loadAll(false); S.connected = true; readyResolve(true); render(); startPolling(); return; }
catch (e) { S.error = e.status === 401 ? "Your token expired or was revoked. Connect again." : e.status === 404 ? "This token can't see your data repo anymore." : "Couldn't reach GitHub. Check your connection, then connect again."; }
}
readyResolve(false);
render();
}
setInterval(() => { if (S.connected && !document.hidden && !S.drawer && S.tab === "overview") schedule(); }, 60000);
boot();
})();
</script>
</body>
